name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: # crawl.yml 이 데이터 커밋 후 호출

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 브랜치 최신 커밋을 받아야 crawl.yml 이 방금 커밋한 데이터가 포함됩니다.
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # package-lock.json 이 아직 없을 수 있으므로(로컬에서 npm install 을 안 했을 때) 분기
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
