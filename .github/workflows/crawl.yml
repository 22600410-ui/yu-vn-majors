name: Crawl YU departments

# 영남대 학과 정보를 GitHub 서버에서 수집 → public/data/departments.json 커밋 → 사이트 재배포
# PC에 Python/Node 설치가 필요 없습니다.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: '상세 페이지 수집 개수 (0 = 전체). 0이 아니면 테스트로 간주해 커밋하지 않고 결과 파일만 내려받을 수 있게 올립니다.'
        type: number
        default: 0
      details:
        description: '학과 상세 페이지까지 수집'
        type: boolean
        default: true
      deploy:
        description: '변경이 있으면 사이트 재배포'
        type: boolean
        default: true
  schedule:
    - cron: '0 18 * * 0' # 매주 월요일 03:00 (KST)

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      LIMIT: ${{ inputs.limit || 0 }}
      NO_DETAILS: ${{ github.event_name == 'workflow_dispatch' && !inputs.details && '--no-details' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Run crawler
        run: |
          python scripts/crawl_departments.py \
            --limit "$LIMIT" $NO_DETAILS \
            --export-untranslated data/untranslated.vi.json

      - name: Summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("public/data/departments.json", encoding="utf-8"))
          m = d["meta"]
          errs = [x["name"]["ko"] for c in d["colleges"] for x in c["departments"] if x.get("crawlError")]
          print("### 수집 결과")
          print(f"- 단과대학 {m['collegeCount']}개 / 학과 {m['departmentCount']}개")
          print(f"- 베트남어 미번역 문장 {m['untranslatedCount']}개 (Artifacts의 untranslated-vi 에서 다운로드)")
          print(f"- 상세 페이지 실패 {len(errs)}개" + (": " + ", ".join(errs) if errs else ""))
          EOF

      - name: Upload untranslated list / test result
        uses: actions/upload-artifact@v4
        with:
          name: untranslated-vi
          path: |
            data/untranslated.vi.json
            public/data/departments.json

      - name: Commit data
        id: commit
        run: |
          if [ "$LIMIT" != "0" ]; then
            echo "limit=$LIMIT → 테스트 실행이므로 커밋하지 않습니다."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet -- public/data/departments.json; then
            echo "변경 없음"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/departments.json
          git commit -m "data: update departments.json ($(date -u +%Y-%m-%d))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN으로 한 push는 deploy.yml의 push 트리거를 실행하지 않으므로 직접 호출합니다.
  deploy:
    needs: crawl
    if: needs.crawl.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.deploy)
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
